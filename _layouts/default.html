<!doctype html>
<html lang="zh-CN">
  {% include head.html %}
  <body>
    <div class="wrap">
      <header class="site-header">
        <h1 class="site-title">G.elsevale</h1>
      </header>

      <nav class="jump-to" aria-label="Jump to">
        <span class="jump-to-label" aria-hidden="true">Jump to</span>
        <div role="tablist" aria-label="页面分区">
          <button class="tab" type="button" role="tab" id="tab-intro" aria-controls="panel-intro" aria-selected="false" data-panel="panel-intro">简介</button>
          <button class="tab" type="button" role="tab" id="tab-blog" aria-controls="panel-blog" aria-selected="false" data-panel="panel-blog">博客</button>
          <button class="tab" type="button" role="tab" id="tab-elsewhere" aria-controls="panel-elsewhere" aria-selected="true" data-panel="panel-elsewhere">Elsewhere</button>
          <button class="tab" type="button" role="tab" id="tab-email" aria-controls="panel-email" aria-selected="false" data-panel="panel-email">Contact</button>
        </div>
      </nav>

      <main>
        {{ content }}
      </main>

      <footer class="site-footer">
        <p>G.elsevale</p>
      </footer>
    </div>

    <script src="{{ '/assets/js/tabs.js' | relative_url }}"></script>
  </body>
</html>
