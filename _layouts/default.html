<!doctype html>
<html lang="zh-CN">
  {% include head.html %}
  <body>
    <div class="wrap">
      <header class="site-header">
        <h1 class="site-title">G.elsevale</h1>
        <div class="site-tagline-wrap">
          <p class="site-tagline site-tagline-cn">在梦之隅每天给世界发糖豆</p>
          <p class="site-tagline site-tagline-en">Handing the world a jelly bean a day, from a corner of dreams.</p>
        </div>
      </header>

      <div class="layout">
        <nav class="jump-to" aria-label="Jump to">
          <div class="tablist" role="tablist" aria-label="页面分区">
            <button class="tab" type="button" role="tab" id="tab-intro" aria-controls="panel-intro" aria-selected="false" data-panel="panel-intro">About</button>
            <button class="tab" type="button" role="tab" id="tab-blog" aria-controls="panel-blog" aria-selected="false" data-panel="panel-blog">Blog</button>
            <button class="tab" type="button" role="tab" id="tab-work" aria-controls="panel-work" aria-selected="false" data-panel="panel-work">Work</button>
            <button class="tab" type="button" role="tab" id="tab-program" aria-controls="panel-program" aria-selected="false" data-panel="panel-program">Program</button>
            <button class="tab" type="button" role="tab" id="tab-elsewhere" aria-controls="panel-elsewhere" aria-selected="true" data-panel="panel-elsewhere">Elsewhere</button>
          </div>
        </nav>

        <main>
          {{ content }}
        </main>
      </div>

      <footer class="site-footer">
        <p>G.elsevale</p>
        <a class="chip" href="mailto:spiritualhorses@163.com" aria-label="Email"><span class="chip-icon chip-icon--email" aria-hidden="true"><svg viewBox="0 0 20 20" width="16" height="16" fill="currentColor" aria-hidden="true" focusable="false"><path d="M18 7.373V14.5a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 2 14.5V7.373l7.746 4.558a.5.5 0 0 0 .508 0zM15.5 4a2.5 2.5 0 0 1 2.485 2.223L10 10.92L2.015 6.223A2.5 2.5 0 0 1 4.5 4z"/></svg></span></a>
      </footer>
    </div>

    <script src="{{ '/assets/js/tabs.js' | relative_url }}"></script>
  </body>
</html>
