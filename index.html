---
layout: default
---
        <section class="panel" id="panel-intro" role="tabpanel" aria-labelledby="tab-intro" hidden>
          <h2 class="section-title">简介</h2>
          <p class="placeholder-note">占位文字 — 简介内容以后替换。</p>
        </section>

        <section class="panel" id="panel-blog" role="tabpanel" aria-labelledby="tab-blog" hidden>
          <h2 class="section-title">博客</h2>
          {% if site.posts.size > 0 %}
          <ul class="post-list">
            {% for post in site.posts limit:5 %}
            <li><a href="{{ post.url | relative_url }}">{{ post.title }}</a> <span class="post-date">{{ post.date | date: "%Y-%m-%d" }}</span></li>
            {% endfor %}
          </ul>
          <p class="more-link"><a href="{{ '/blog/' | relative_url }}">全部文章 →</a></p>
          {% else %}
          <p class="placeholder-note">占位文字 — 博客内容以后替换。</p>
          {% endif %}
        </section>

        <section class="panel" id="panel-contact" role="tabpanel" aria-labelledby="tab-contact">
          <h2 class="section-title">Contact</h2>
          {% include contact-chips.html %}
        </section>
